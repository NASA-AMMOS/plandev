table:
  name: scheduling_specification_conditions
  schema: scheduler
configuration:
  custom_name: "scheduling_specification_conditions"
object_relationships:
  - name: condition_metadata
    using:
      foreign_key_constraint_on: condition_id
  - name: condition_definition
    using:
      foreign_key_constraint_on:
        - condition_id
        - condition_revision
  - name: specification
    using:
      foreign_key_constraint_on: specification_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
# TODO: Modify these once we have a solution for cross-db auth (These permissions should be based on plan ownership/collaboratorship)
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [specification_id, condition_id, condition_revision, enabled]
      check: {}
  - role: 2-user
    permission:
      columns: [specification_id, condition_id, condition_revision, enabled]
      check: {}
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [condition_revision, enabled]
      filter: {}
  - role: 2-user
    permission:
      columns: [condition_revision, enabled]
      filter: {}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {}
