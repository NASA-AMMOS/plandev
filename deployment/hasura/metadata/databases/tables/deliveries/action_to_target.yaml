table:
  name: action_to_target
  schema: deliveries
configuration:
  custom_name: "action_to_target"
object_relationships:
- name: target
  using:
    foreign_key_constraint_on: target_name
- name: action
  using:
    manual_configuration:
      column_mapping:
        action_id: id
      remote_table:
        name: action_definition
        schema: actions
- name: action_configuration
  using:
    manual_configuration:
      column_mapping:
        action_id: action_definition_id
        configuration_name: name
      remote_table:
        name: action_configuration
        schema: actions
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [target_name, configuration_name, action_id]
      check: {}
  - role: user
    permission:
      columns: [target_name, configuration_name, action_id]
      check: {}
update_permissions:
  - role: aerie_admin
    permission:
      columns: [target_name, configuration_name, action_id]
      filter: {}
  - role: user
    permission:
      columns: [target_name, configuration_name, action_id]
      filter: {}
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {}
