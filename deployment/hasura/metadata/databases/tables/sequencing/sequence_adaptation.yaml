table:
  name: sequence_adaptation
  schema: sequencing
configuration:
  custom_name: "sequence_adaptation"
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [adaptation, name]
      check: {}
      set:
        owner: "x-hasura-user-id"
        updated_by: "x-hasura-user-id"
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [adaptation, name, owner]
      filter: {}
      set:
        updated_by: "x-hasura-user-id"
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
