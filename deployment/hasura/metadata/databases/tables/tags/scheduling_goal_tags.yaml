table:
  name: scheduling_goal_tags
  schema: tags
configuration:
  custom_name: "scheduling_goal_tags"
object_relationships:
  - name: goal_metadata
    using:
      foreign_key_constraint_on: goal_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [goal_id, tag_id]
      check: {}
  - role: 2-user
    permission:
      columns: [goal_id, tag_id]
      check: {"goal_metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"goal_metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}
