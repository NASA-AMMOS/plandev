name: Load Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PLANDEV_USERNAME: "${{secrets.AERIE_USERNAME}}"
  PLANDEV_PASSWORD: "${{secrets.AERIE_PASSWORD}}"
  HASURA_GRAPHQL_ADMIN_SECRET: "${{secrets.HASURA_GRAPHQL_ADMIN_SECRET}}"
  HASURA_GRAPHQL_JWT_SECRET: "${{secrets.HASURA_GRAPHQL_JWT_SECRET}}"
  POSTGRES_USER: "${{secrets.POSTGRES_USER}}"
  POSTGRES_PASSWORD: "${{secrets.POSTGRES_PASSWORD}}"
  PLANDEV_DATABASE_NAME: "${{secrets.PLANDEV_DATABASE_NAME}}"
  PLANDEV_METADATA_DATABASE_NAME: "${{secrets.PLANDEV_METADATA_DATABASE_NAME}}"
  PLANDEV_FILE_STORE_NAME: "${{secrets.PLANDEV_FILE_STORE_NAME}}"
  GATEWAY_USERNAME: "${{secrets.GATEWAY_USERNAME}}"
  GATEWAY_PASSWORD: "${{secrets.GATEWAY_PASSWORD}}"
  MERLIN_USERNAME: "${{secrets.MERLIN_USERNAME}}"
  MERLIN_PASSWORD: "${{secrets.MERLIN_PASSWORD}}"
  SCHEDULER_USERNAME: "${{secrets.SCHEDULER_USERNAME}}"
  SCHEDULER_PASSWORD: "${{secrets.SCHEDULER_PASSWORD}}"
  SEQUENCING_USERNAME: "${{secrets.SEQUENCING_USERNAME}}"
  SEQUENCING_PASSWORD: "${{secrets.SEQUENCING_PASSWORD}}"

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: load-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          # This action defaults to matching on "main" and "master" as the branches allowed to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble
        run: ./gradlew assemble --parallel
      - name: Start Services
        run: |
          docker compose up -d --build --quiet-pull
          docker images
          docker ps -a
      - name: Sleep for 1 min
        shell: bash
        run: sleep 1m
      - name: Run load test
        run: |
          cd load-tests
          ./load-test.sh
      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Load Test Results
          path: "**/load-tests/load-report.*"
      - name: Stop Services
        if: always()
        run: |
          docker ps -a
          docker compose down
          docker ps -a
      - name: Prune
        if: always()
        run: docker volume prune -fa
