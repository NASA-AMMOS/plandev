table:
  name: user_sequence_metadata
  schema: sequencing
configuration:
  custom_name: "user_sequence_metadata"
array_relationships:
  - name: versions
    using:
      foreign_key_constraint_on:
        column: sequence_id
        table:
          name: user_sequence
          schema: sequencing
  - name: models_using
    using:
      foreign_key_constraint_on:
        column: user_sequence_id
        table:
          name: scheduling_model_specification_user_sequence
          schema: scheduler
  - name: plans_using
    using:
      foreign_key_constraint_on:
        column: user_sequence_id
        table:
          name: scheduling_specification_user_sequence
          schema: scheduler
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [name, description, public, owner, updated_by, created_at, updated_at]
      check: {}
      set:
        owner: "x-hasura-user-id"
  - role: user
    permission:
      columns: [name, description, public, owner, updated_by, created_at, updated_at]
      check: {}
      set:
        owner: "x-hasura-user-id"
update_permissions:
  - role: aerie_admin
    permission:
      columns: [name, description, public, owner, updated_by, created_at, updated_at]
      filter: {}
  - role: user
    permission:
      columns: [name, description, public, owner, updated_by, created_at, updated_at]
      filter: { "owner": { "_eq": "x-hasura-user-id" } }
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {"owner":{"_eq":"x-hasura-user-id"}}
