table:
  name: scheduling_condition_tags
  schema: tags
configuration:
  custom_name: "scheduling_condition_tags"
object_relationships:
  - name: condition_metadata
    using:
      foreign_key_constraint_on: condition_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [condition_id, tag_id]
      check: {}
  - role: 2-user
    permission:
      columns: [condition_id, tag_id]
      check: {"condition_metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"condition_metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}
