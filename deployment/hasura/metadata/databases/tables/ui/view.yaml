table:
  name: view
  schema: ui
configuration:
  custom_name: "view"
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [definition, name]
      check: {}
      set:
        owner: "x-hasura-user-id"
  - role: 2-user
    permission:
      columns: [definition, name]
      check: {}
      set:
        owner: "x-hasura-user-id"
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [definition, name, owner]
      filter: {}
  - role: 2-user
    permission:
      columns: [definition, name, owner]
      filter: {"owner":{"_eq":"x-hasura-user-id"}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"owner":{"_eq":"x-hasura-user-id"}}
