table:
  name: plan_snapshot_tags
  schema: tags
configuration:
  custom_name: "plan_snapshot_tags"
object_relationships:
  - name: plan_snapshot
    using:
      foreign_key_constraint_on: snapshot_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [snapshot_id, tag_id]
      check: {}
  - role: 2-user
    permission:
      columns: [snapshot_id, tag_id]
      check: {"plan_snapshot":{"plan":{"_or":[
        {"owner":{"_eq":"X-Hasura-User-Id"}},
        {"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"plan_snapshot":{"plan":{"_or":[
        {"owner":{"_eq":"X-Hasura-User-Id"}},
        {"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}}
