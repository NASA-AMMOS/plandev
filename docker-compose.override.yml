# Local development overrides.
#
# Compose loads this file automatically on top of docker-compose.yml, so
# `docker compose up --build` picks it up with no -f flags. Keeping these
# changes here leaves docker-compose.yml matching develop, so local setup
# never shows up in a diff or gets swept into a commit.
#
# This file is untracked on purpose — it points at sibling checkouts that only
# exist on this machine.
services:
  # Build the gateway and UI from local checkouts instead of pulling the
  # published develop images. Both use Dockerfile.dev, which builds from a
  # clean source tree (the upstream Dockerfiles expect a prebuilt dist/).
  aerie_gateway:
    build:
      context: ../plandev-gateway
      dockerfile: Dockerfile.dev
    image: aerie_gateway

  aerie_ui:
    build:
      context: ../plandev-ui
      dockerfile: Dockerfile.dev
    image: aerie_ui

  # Merlin and its workers need the orbiter model's SPICE kernels and the OPS
  # repo mounted in. OPS_REPO_PATH is set in .env.
  aerie_merlin:
    environment:
      SPICE_DIRECTORY: /usr/src/app/spice/kernels
    volumes:
      - ../aerie-orbiter-model/spice/kernels:/usr/src/app/spice/kernels
      - ${OPS_REPO_PATH}:/usr/src/app/OPS:ro

  aerie_merlin_worker_1:
    environment:
      SPICE_DIRECTORY: /usr/src/app/spice/kernels
    volumes:
      - ../aerie-orbiter-model/spice/kernels:/usr/src/app/spice/kernels
      - ${OPS_REPO_PATH}:/usr/src/app/OPS:ro

  aerie_merlin_worker_2:
    environment:
      SPICE_DIRECTORY: /usr/src/app/spice/kernels
    volumes:
      - ../aerie-orbiter-model/spice/kernels:/usr/src/app/spice/kernels
      - ${OPS_REPO_PATH}:/usr/src/app/OPS:ro
