table:
  name: activity_presets
  schema: merlin
configuration:
  custom_name: "activity_presets"
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [model_id, name, associated_activity_type, arguments]
      check: {}
      set:
        owner: "x-hasura-user-id"
  - role: 2-user
    permission:
      columns: [model_id, name, associated_activity_type, arguments]
      check: {}
      set:
        owner: "x-hasura-user-id"
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [model_id, name, associated_activity_type, arguments, owner]
      filter: {}
  - role: 2-user
    permission:
      columns: [name, arguments, owner]
      filter: {"owner":{"_eq":"X-Hasura-User-Id"}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"owner":{"_eq":"X-Hasura-User-Id"}}
