apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: plandev-dev
  name: hasura
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasura
  template:
    metadata:
      labels:
        app: hasura
    spec:
      containers:
        - name: hasura
          image: ghcr.io/nasa-ammos/plandev-hasura
          ports:
            - containerPort: 8080
          env:
            - name: PLANDEV_DATABASE_URL
              value: postgres://plandev:plandev@postgres:5432/plandev
            - name: PLANDEV_MERLIN_URL
              value: http://plandev_merlin:27183
            - name: PLANDEV_SCHEDULER_URL
              value: http://plandev_scheduler:27185
            - name: PLANDEV_SEQUENCING_URL
              value: http://plandev_sequencing:27184
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-env
                  key: HASURA_GRAPHQL_ADMIN_SECRET
            - name: HASURA_GRAPHQL_METADATA_DATABASE_URL
              value: postgres://plandev:plandev@postgres:5432/plandev_hasura
            - name: HASURA_GRAPHQL_DEV_MODE
              value: "true"
            - name: HASURA_GRAPHQL_ENABLED_LOG_TYPES
              value: startup, http-log, webhook-log, websocket-log, query-log
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: "true"
            - name: HASURA_GRAPHQL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-env
                  key: HASURA_GRAPHQL_JWT_SECRET
            - name: HASURA_GRAPHQL_LOG_LEVEL
              value: warn
            - name: HASURA_GRAPHQL_METADATA_DIR
              value: /hasura-metadata
