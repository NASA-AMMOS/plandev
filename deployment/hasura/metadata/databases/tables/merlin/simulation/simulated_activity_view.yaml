table:
  name: simulated_activity
  schema: merlin
configuration:
  custom_name: "simulated_activity"
object_relationships:
- name: simulation_dataset
  using:
    manual_configuration:
      remote_table:
        name: simulation_dataset
        schema: merlin
      column_mapping:
        simulation_dataset_id: id
- name: parent_simulated_activity
  using:
    manual_configuration:
      remote_table:
        name: simulated_activity
        schema: merlin
      column_mapping:
        parent_id: id
- name: activity_directive
  using:
    manual_configuration:
      remote_table:
        schema: merlin
        name: activity_directive
      insertion_order: null
      column_mapping:
        directive_id: id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
