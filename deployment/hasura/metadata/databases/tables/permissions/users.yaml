table:
  name: users
  schema: permissions
configuration:
  custom_name: "users"
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: [username]
      filter: {}
      allow_aggregations: true
  - role: 3-viewer
    permission:
      columns: [username]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [username, default_role]
      check: {}
  - role: 2-user
    permission:
      columns: [username, default_role]
      check: {"username":{"_eq":"X-Hasura-User-Id"}}
  - role: 3-viewer
    permission:
      columns: [username, default_role]
      check: {"username":{"_eq":"X-Hasura-User-Id"}}
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [username, default_role]
      filter: {}
  - role: 2-user
    permission:
      columns: [username, default_role]
      filter: {"username":{"_eq":"X-Hasura-User-Id"}}
  - role: 3-viewer
    permission:
      columns: [username, default_role]
      filter: {"username":{"_eq":"X-Hasura-User-Id"}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
