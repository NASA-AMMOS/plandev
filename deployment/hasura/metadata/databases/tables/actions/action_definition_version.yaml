table:
  name: action_definition_version
  schema: actions
configuration:
  custom_name: "action_definition_version"
object_relationships:
  - name: action_definition
    using:
      foreign_key_constraint_on: action_definition_id
  - name: action_file
    using:
      foreign_key_constraint_on: action_file_id
select_permissions:
  - role: aerie_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [action_definition_id, action_file_id, archived, parameter_schema, settings_schema]
      check: {}
      set:
        author: "x-hasura-user-id"
  - role: user
    permission:
      columns: [action_definition_id, action_file_id, archived, parameter_schema, settings_schema]
      check: { "action_definition": { "workspace": { "_or": [ { "owner": { "_eq": "X-Hasura-User-Id" } },{ "collaborators": { "collaborator": { "_eq": "X-Hasura-User-Id" } } } ] } } }
      set:
        author: "x-hasura-user-id"
update_permissions:
  - role: aerie_admin
    permission:
      columns: [archived, parameter_schema, settings_schema]
      filter: {}
  - role: user
    permission:
      columns: [archived]
      filter: { "action_definition": { "workspace": { "_or": [ { "owner": { "_eq": "X-Hasura-User-Id" } },{ "collaborators": { "collaborator": { "_eq": "X-Hasura-User-Id" } } } ] } } }
