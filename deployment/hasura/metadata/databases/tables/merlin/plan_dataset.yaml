table:
  name: plan_dataset
  schema: merlin
configuration:
  custom_name: "plan_dataset"
object_relationships:
- name: dataset
  using:
    foreign_key_constraint_on: dataset_id
- name: plan
  using:
    foreign_key_constraint_on: plan_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"plan":{"owner":{"_eq":"X-Hasura-User-Id"}}}
# Uploading/Extending is controlled via an action
