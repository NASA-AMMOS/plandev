table:
  name: user_roles
  schema: permissions
configuration:
  custom_name: "user_roles"
is_enum: true
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [role, description]
      check: {"role":{"_neq":"admin"}}
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [role, description]
      filter: {}
      check: {"role":{"_neq":"admin"}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
