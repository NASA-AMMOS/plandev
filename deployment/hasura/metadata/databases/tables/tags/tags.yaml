table:
  name: tags
  schema: tags
configuration:
  custom_name: "tags"
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [name, color]
      check: {}
      set:
        owner: "x-hasura-user-id"
  - role: 2-user
    permission:
      columns: [name, color]
      check: {}
      set:
        owner: "x-hasura-user-id"
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [name, color, owner]
      filter: {}
  - role: 2-user
    permission:
      columns: [name, color, owner]
      filter: {"owner":{"_eq":"X-Hasura-User-Id"}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"owner":{"_eq":"X-Hasura-User-Id"}}
