# GraalPy / polyglot version (roadmap §4.1).
#
# Pinned deliberately; treat bumps as a decision, not a refresh. This single
# property is consumed by BOTH merlin-worker and merlin-server so the two
# images cannot drift apart (see roadmap §11.1: merlin-server loads model
# types server-side via the same MissionModelLoader the worker uses).
#
# NOTE: pymerlin's java/pymerlin-shim/build.gradle declares these same three
# coordinates as `compileOnly` and lives in a SEPARATE Gradle build, so it
# cannot read this property. Bumping here means bumping there too, or the
# shim compiles against an API the worker does not provide at runtime.
#
# Must also stay in sync with GRAALPY_VERSION in merlin-worker/Dockerfile and
# merlin-server/Dockerfile, which download the matching standalone GraalPy to
# build the venv.
graalPyVersion=25.0.2

# Properties for configuring the publish task.
#
# Points at this fork's own package registry, not upstream nasa-ammos/plandev: this
# fork's `publish` job has no write access to the upstream org's packages (and never
# did -- publishing there would just fail with a permission error), and pymerlin-shim
# now needs Maven coordinates for modules with fork-specific changes that were never
# merged upstream (graalpy-engine-cache is new; merlin-framework's ModelActions.ask()
# doesn't exist upstream either) -- so upstream's registry wouldn't have the right
# artifacts published even if this fork could write to it.
publishing.name=GitHubPackages
publishing.url=https://maven.pkg.github.com/remy-rabideau/plandev
publishing.usernameEnvironmentVariable=GITHUB_ACTOR
publishing.passwordEnvironmentVariable=GITHUB_TOKEN

# Left empty, is lazily set when building
publishing.version=

# Override for releases

# Change the version number here
version.number=4.3.0

# If you are publishing a release *manually* (i.e. not through github actions),
# override this on the command line with `./gradlew publish -Pversion.isRelease=true`.
version.isRelease=false
