table:
  name: scheduling_specification_user_sequence
  schema: scheduler
configuration:
  custom_name: "scheduling_specification_user_sequence"
object_relationships:
  - name: user_sequence
    using:
      foreign_key_constraint_on:
        - user_sequence_id
        - user_sequence_revision
  - name: specification
    using:
      foreign_key_constraint_on: specification_id
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
# TODO: Modify these once we have a solution for cross-db auth (These permissions should be based on plan ownership/collaboratorship)
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [specification_id, user_sequence_id, user_sequence_revision, enabled]
      check: {}
  - role: user
    permission:
      columns: [specification_id, user_sequence_id, user_sequence_revision, enabled]
      check: {}
update_permissions:
  - role: aerie_admin
    permission:
      columns: [user_sequence_revision, enabled]
      filter: {}
  - role: user
    permission:
      columns: [user_sequence_revision, enabled]
      filter: {}
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {}
