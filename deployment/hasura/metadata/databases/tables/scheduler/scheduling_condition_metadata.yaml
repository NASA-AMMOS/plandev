table:
  name: scheduling_condition_metadata
  schema: scheduler
configuration:
  custom_name: "scheduling_condition_metadata"
array_relationships:
  - name: tags
    using:
      foreign_key_constraint_on:
        column: condition_id
        table:
          name: scheduling_condition_tags
          schema: tags
  - name: versions
    using:
      foreign_key_constraint_on:
        column: condition_id
        table:
          name: scheduling_condition_definition
          schema: scheduler
  - name: models_using
    using:
      foreign_key_constraint_on:
        column: condition_id
        table:
          name: scheduling_model_specification_conditions
          schema: scheduler
  - name: plans_using
    using:
      foreign_key_constraint_on:
        column: condition_id
        table:
          name: scheduling_specification_conditions
          schema: scheduler
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
# This should have filtering based on privacy, but cross-database permissions restrictions prevent that
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [name, description, public]
      check: {}
      set:
        owner: "x-hasura-user-id"
        updated_by: "x-hasura-user-id"
  - role: 2-user
    permission:
      columns: [name, description, public]
      check: {}
      set:
        owner: "x-hasura-user-id"
        updated_by: "x-hasura-user-id"
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [name, description, public, owner]
      filter: {}
      set:
        updated_by: "x-hasura-user-id"
  - role: 2-user
    permission:
      columns: [name, description, public, owner]
      filter: { "owner": { "_eq": "X-Hasura-User-Id" } }
      set:
        updated_by: "x-hasura-user-id"
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: { "owner": { "_eq": "X-Hasura-User-Id" } }
