table:
  name: delivery
  schema: deliveries
configuration:
  custom_name: "delivery"
array_relationships:
  - name: files
    using:
      foreign_key_constraint_on:
        column: delivery_id
        table:
          name: file_to_delivery
          schema: deliveries
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [name, status, target]
      check: {}
      set:
        updated_by: "x-hasura-user-id"
  - role: user
    permission:
      columns: [name, status, target]
      check: {}
      set:
        updated_by: "x-hasura-user-id"
update_permissions:
  - role: aerie_admin
    permission:
      columns: [name, status, target]
      filter: {}
      set:
        updated_by: "x-hasura-user-id"
  - role: user
    permission:
      columns: [name, status, target]
      filter: {}
      set:
        updated_by: "x-hasura-user-id"
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {}
