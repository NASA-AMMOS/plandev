table:
  name: expansion_rule_tags
  schema: tags
configuration:
  custom_name: "expansion_rule_tags"
object_relationships:
  - name: expansion_rule
    using:
      foreign_key_constraint_on: rule_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [rule_id, tag_id]
      check: {}
  - role: 2-user
    permission:
      columns: [rule_id, tag_id]
      check: {}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {}
