name: Test

on:
  pull_request:
    branches:
      - develop
      - dev-[0-9]+.[0-9]+.[0-9]+
    types:
      # defaults + 'edited', to handle changes to flags like ___REQUIRES_GATEWAY_PR___ in the PR body
      [ opened, synchronize, reopened, edited ]
  push:
    branches:
      - develop
    tags:
      - v*
  workflow_dispatch:

env:
  AERIE_USERNAME: "${{secrets.AERIE_USERNAME}}"
  AERIE_PASSWORD: "${{secrets.AERIE_PASSWORD}}"
  HASURA_GRAPHQL_ADMIN_SECRET: "${{secrets.HASURA_GRAPHQL_ADMIN_SECRET}}"
  HASURA_GRAPHQL_JWT_SECRET: "${{secrets.HASURA_GRAPHQL_JWT_SECRET}}"
  POSTGRES_USER: "${{secrets.POSTGRES_USER}}"
  POSTGRES_PASSWORD: "${{secrets.POSTGRES_PASSWORD}}"
  GATEWAY_USERNAME: "${{secrets.GATEWAY_USERNAME}}"
  GATEWAY_PASSWORD: "${{secrets.GATEWAY_PASSWORD}}"
  MERLIN_USERNAME: "${{secrets.MERLIN_USERNAME}}"
  MERLIN_PASSWORD: "${{secrets.MERLIN_PASSWORD}}"
  SCHEDULER_USERNAME: "${{secrets.SCHEDULER_USERNAME}}"
  SCHEDULER_PASSWORD: "${{secrets.SCHEDULER_PASSWORD}}"
  SEQUENCING_USERNAME: "${{secrets.SEQUENCING_USERNAME}}"
  SEQUENCING_PASSWORD: "${{secrets.SEQUENCING_PASSWORD}}"
  PR_BODY: "${{github.event.pull_request.body}}"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Load NPM Cache
        uses: ./.github/actions/load-node-cache
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # This action defaults to matching on "main" and "master" as the branches allowed to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble
        # Don't generate docs for tests
        run: ./gradlew assemble -x javadoc -x javadocJar -x generateDocumentation --parallel
      - name: Run Unit Tests
        run: ./gradlew test --parallel
      - name: Upload Test Results as XML and HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Unit Test Results
          path: |
            **/build/test-results/test
            **/build/reports/tests/test

  action-unit-tests:
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup NPM
        uses: actions/setup-node@v6
        with:
          node-version-file: ./action-server/.nvmrc
          cache: npm
          cache-dependency-path: ./action-server/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: ./action-server
      - name: Run Action Server Unit Tests
        run: npm --silent run test
        working-directory: ./action-server
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Action Server Test Results
          path: |
            **/action-server/action-server-test-report.log

  db-tests:
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Postgres Client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # This action defaults to matching on "main" and "master" as the branches allowed to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Start Services
        run: |
          docker compose -f ./e2e-tests/docker-compose-test.yml up postgres -d --quiet-pull
      - name: Sleep for 5 Seconds
        run: sleep 5s
        shell: bash
      - name: Run DB Tests
        run: ./gradlew db-tests:e2eTest
      - name: Upload DB Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DB Test Results
          path: |
            **/db-tests/build/reports/tests/e2eTest
      - name: Shutdown Backend
        uses: ./.github/actions/shutdown-test-backend

  sequencing-e2e-tests:
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # This action defaults to matching on "main" and "master" as the branches allowed to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Start E2E Test Backend
        uses: ./.github/actions/start-test-backend
      - name: Run Sequencing E2E Tests
        run: ./gradlew sequencing-server:e2eTest
      - name: Upload Sequencing E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sequencing E2E Test Results
          path: |
            **/sequencing-server/test-report.*
      - name: Shutdown E2E Test Backend
        uses: ./.github/actions/shutdown-test-backend

  external-model-e2e-tests:
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      # The adapters live in plandev-examples: they are demonstration backends, not part of this
      # build, and keeping them out of this repo is what makes "a backend is just something that
      # speaks the contract" true rather than aspirational.
      - name: Checkout example backends
        uses: actions/checkout@v6
        with:
          repository: NASA-AMMOS/plandev-examples
          path: plandev-examples
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Start E2E Test Backend
        uses: ./.github/actions/start-test-backend

      # WHICH adapters run here, and why not all four.
      #
      # The Python battery and the NeXosim model are cheap and self-contained: stdlib, and a Rust
      # build that finishes in seconds. Between them they cover the whole generic contract -- the
      # ingest gate, identity attestation, capabilities, computed attributes, unfinished spans -- plus
      # the out-of-process ExecBackend path and the ValueSchema types (struct, string, int) that only
      # the Rust model exercises.
      #
      # Blackbird and Basilisk are deliberately NOT built. Blackbird compiles jplTime and Blackbird
      # from source with Maven and needs a JNISpice jar; Basilisk downloads 128 MB of SPICE kernels
      # from naif.jpl.nasa.gov and produces a 1.3 GB image. Each would add three network dependencies
      # that can fail for reasons unrelated to the change under test, and the NAIF download on every
      # pull request would be both slow and rude.
      #
      # BE HONEST ABOUT WHAT THIS COVERS: 9 of the 27 tests run here. The other 18 skip, and the skip
      # names the backend, so the gap is visible in the report rather than silently absent. What runs
      # is the generic contract -- ingest gate rejection, identity drift and recovery, unfinished
      # spans, anchor resolution, stored capabilities, the out-of-process ExecBackend path, and the
      # struct/string/int ValueSchema types. What does not is everything Blackbird- or
      # Basilisk-specific, plus the handful of tests that assert across two backends at once.
      #
      # To run the whole suite, bring up all four adapters against a local stack:
      #   cd plandev-examples/external-model-backends && PLANDEV_NETWORK=<net> docker compose up -d
      - name: Build and start the cheap adapters
        working-directory: plandev-examples/external-model-backends
        run: |
          docker build -q -f python/Dockerfile -t plandev/python-adapter .
          docker build -q -f nexosim/Dockerfile -t plandev/nexosim-adapter .
          # Join the network the test stack created, and use the service names merlin was configured
          # with in docker-compose-test.yml.
          NETWORK=$(docker inspect aerie_merlin --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run -d --name python-adapter  --network "$NETWORK" plandev/python-adapter
          docker run -d --name nexosim-adapter --network "$NETWORK" plandev/nexosim-adapter
          docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Run External Model E2E Tests
        run: ./gradlew :e2e-tests:e2eTest --tests '*ExternalModelTests*'
      - name: Upload External Model E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: External Model E2E Test Results
          path: |
            **/e2e-tests/build/reports/tests/e2eTest
      - name: Adapter logs
        if: failure()
        run: docker logs python-adapter; docker logs nexosim-adapter
      - name: Shutdown E2E Test Backend
        uses: ./.github/actions/shutdown-test-backend

  java-e2e-test:
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # This action defaults to matching on "main" and "master" as the branches allowed to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Start E2E Test Backend
        uses: ./.github/actions/start-test-backend
      - name: Build scheduling procedure jars for testing
        run: ./gradlew e2e-tests:buildAllProcedureJars
      - name: Run E2E Tests
        run: ./gradlew e2e-tests:e2eTest
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: E2E Test Results
          path: |
            **/e2e-tests/build/reports/tests/e2eTest
      - name: Shutdown Backend
        uses: ./.github/actions/shutdown-test-backend
