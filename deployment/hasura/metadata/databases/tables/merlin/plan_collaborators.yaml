table:
  name: plan_collaborators
  schema: merlin
configuration:
  custom_name: "plan_collaborators"
object_relationships:
  - name: plan
    using:
      foreign_key_constraint_on: plan_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [plan_id, collaborator]
      check: {}
  - role: 2-user
    permission:
      columns: [plan_id, collaborator]
      check: {"plan":{"_or":[{"owner":{"_eq":"X-Hasura-User-Id"}},{"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"plan":{"_or":[{"owner":{"_eq":"X-Hasura-User-Id"}},{"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}
