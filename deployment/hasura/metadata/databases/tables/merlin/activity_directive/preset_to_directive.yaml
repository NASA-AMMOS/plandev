table:
  name: preset_to_directive
  schema: merlin
configuration:
  custom_name: "preset_to_directive"
object_relationships:
  - name: directive_applied_to
    using:
      foreign_key_constraint_on:
        - activity_id
        - plan_id
  - name: preset_applied
    using:
      foreign_key_constraint_on: preset_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      check: {}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"directive_applied_to":{"plan":{"_or":[{"owner":{"_eq":"X-Hasura-User-Id"}},{"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}}
# Insert/Update are controlled via a SQL function
