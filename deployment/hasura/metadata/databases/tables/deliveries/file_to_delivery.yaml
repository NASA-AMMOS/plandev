table:
  name: file_to_delivery
  schema: deliveries
configuration:
  custom_name: "file_to_delivery"
object_relationships:
- name: delivery
  using:
    foreign_key_constraint_on: delivery_id
select_permissions:
  - role: aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: aerie_admin
    permission:
      columns: [filename, delivery_id]
      check: {}
  - role: user
    permission:
      columns: [filename, delivery_id]
      check: {}
update_permissions:
  - role: aerie_admin
    permission:
      columns: [filename, delivery_id]
      filter: {}
  - role: user
    permission:
      columns: [filename, delivery_id]
      filter: {}
delete_permissions:
  - role: aerie_admin
    permission:
      filter: {}
  - role: user
    permission:
      filter: {}
