table:
  name: snapshot_activity_tags
  schema: tags
configuration:
  custom_name: "snapshot_activity_tags"
object_relationships:
  - name: snapshot_activity_directive
    using:
      foreign_key_constraint_on: [snapshot_id, directive_id]
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
