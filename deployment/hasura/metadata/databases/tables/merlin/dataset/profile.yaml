    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
