plugins {
  id 'java'
  id 'application'
  id 'com.github.node-gradle.node' version '5.0.0'
  id 'maven-publish'
  id 'jacoco'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

node {
  nodeProjectDir = file("${project.projectDir.toPath().resolve("constraints-dsl-compiler")}")
  version = '20.12.1'
  download = true
  npmInstallCommand = System.getenv("CI") ? 'ci' : 'install'
}

task assembleConstraintsDSLCompiler(type: NpmTask) {
  dependsOn processResources
  dependsOn npmInstall
  args = ['--silent', 'run', 'build']
  inputs.files('package.json', 'package-lock.json', 'tsconfig.json')
  inputs.dir('src')
}

task generateDocumentation(type: NpmTask) {
  dependsOn npmInstall
  dependsOn processResources
  dependsOn assembleConstraintsDSLCompiler
  args = ['--silent', 'run', 'generate-doc']
  inputs.files('package.json', 'package-lock.json', 'tsconfig.json')
  inputs.dir('src')
}

task cleanDocsFromDocsDir(type: Delete) {
  delete rootDir.toPath().resolve('docs/edsl-api-docs/constraints-edsl-api/develop')
}

task publishDocs {
  dependsOn cleanDocsFromDocsDir
  dependsOn generateDocumentation
}

assemble {
  dependsOn assembleConstraintsDSLCompiler
  dependsOn generateDocumentation
}

test {
  dependsOn nodeSetup
  dependsOn assembleConstraintsDSLCompiler
  useJUnitPlatform {
    includeEngines 'jqwik', 'junit-jupiter'
  }

  // Add node bin directory to PATH, helps CI/CD services without node installed
  environment 'NODE_PATH', node.computedNodeDir.get().toString().concat("/bin/node")

  environment "CONSTRAINTS_DSL_COMPILER_ROOT", projectDir.toPath().resolve('constraints-dsl-compiler')
  environment "CONSTRAINTS_DSL_COMPILER_COMMAND", './build/main.js'

  testLogging {
    exceptionFormat = 'full'
  }
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = true
  }
}

application {
  mainClass = 'gov.nasa.jpl.aerie.merlin.server.AerieAppDriver'
  applicationDefaultJvmArgs = ['-Xmx2g']
}

dependencies {
  implementation project(':type-utils')
  implementation project(':merlin-driver')
  implementation project(':parsing-utilities')
  implementation project(':constraints')
  implementation project(':permissions')
  implementation project(':procedural:constraints')
  implementation project(':procedural:timeline')

  implementation 'io.javalin:javalin:5.6.3'
  implementation 'org.slf4j:slf4j-simple:2.0.7'
  implementation 'org.glassfish:javax.json:1.1.4'
  implementation("com.fasterxml.jackson.core:jackson-databind:2.20.1")

  implementation 'org.postgresql:postgresql:42.6.1'
  implementation 'com.zaxxer:HikariCP:5.0.1'

  // --- GraalPy (roadmap §4.1, §11.1) ---
  //
  // merlin-server needs these for the same reason merlin-worker does, and this
  // is not speculative: Gate A traced POST /refreshActivityTypes ->
  // LocalMissionModelService.refreshActivityTypes() -> MissionModelLoader.loadModelType(),
  // i.e. the server loads pymerlin model types in-process at model upload using
  // the same loader as the worker.
  //
  // §11.1 leaves open a better end-state -- moving activity-type registration
  // wholly worker-side, so only one image carries a Python runtime. If that
  // lands, delete this block.
  //
  // Deliberately NOT including org.graalvm.polyglot:python (a Maven-only
  // <type>pom</type> artifact, no jar of its own). Declared as a plain Gradle
  // `implementation` dependency it resolves to the bare .pom file on the
  // runtime classpath, which leaks -- via `implementation` project-dependency
  // transitivity -- through orchestration-utils's
  // `implementation project(':merlin-server')` into stateless-aerie's fat-jar
  // `jar` task, whose `zipTree(it)` step cannot unzip a .pom file:
  // "Cannot expand ZIP '.../python-25.0.2.pom'." Broke `./gradlew assemble`
  // in practice. GraalPy's own current Gradle docs never list this dependency,
  // only `polyglot` + `python-embedding`; confirmed unnecessary too --
  // GraalPyPreflight's `context.eval("python", "1+1")` passed on real builds
  // without it.
  implementation "org.graalvm.polyglot:polyglot:${graalPyVersion}"
  implementation "org.graalvm.python:python-embedding:${graalPyVersion}"
  // Shared GraalPy Engine, reused across every simulation this process ever runs
  // (roadmap §11.3) -- must be a real runtime dependency here, not compileOnly in
  // pymerlin-shim, so its statics survive the per-simulation URLClassLoader that
  // MissionModelLoader creates for each uploaded model JAR.
  implementation project(':graalpy-engine-cache')

  testImplementation project(':examples:foo-missionmodel')
  testImplementation project(':merlin-framework')
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.0.1'
  testImplementation 'net.jqwik:jqwik:1.6.5'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// NOTE: This module is published ONLY to satisfy a transitive dependency in orchestration-utils.
// It is NOT a stable public API and will be deprecated in a future version.
// TODO: remove this block and the `maven-publish` plugin above once dependencies have been refactored
publishing {
  publications {
    library(MavenPublication) {
      version = findProperty('publishing.version')
      from components.java

      pom {
        name.set("merlin-server (INTERNAL)")
        description.set("This module is not supported. It was published only to satisfy a transitive dependency and will be removed in a future version.")
      }
    }
  }

  publishing {
    repositories {
      maven {
        name = findProperty("publishing.name")
        url = findProperty("publishing.url")
        credentials {
          username = System.getenv(findProperty("publishing.usernameEnvironmentVariable"))
          password = System.getenv(findProperty("publishing.passwordEnvironmentVariable"))
        }
      }
    }
  }
}
