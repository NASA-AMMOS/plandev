table:
  name: constraint_definition_tags
  schema: tags
configuration:
  custom_name: "constraint_definition_tags"
object_relationships:
  - name: constraint_definition
    using:
      foreign_key_constraint_on:
        - constraint_id
        - constraint_revision
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [constraint_id, constraint_revision, tag_id]
      check: {}
  - role: 2-user
    permission:
      columns: [constraint_id, constraint_revision, tag_id]
      check: {"constraint_definition":{"_or":[
        {"author":{"_eq":"X-Hasura-User-Id"}},
        {"metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}]}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
  - role: 2-user
    permission:
      filter: {"constraint_definition":{"_or":[
        {"author":{"_eq":"X-Hasura-User-Id"}},
        {"metadata":{"owner":{"_eq":"X-Hasura-User-Id"}}}]}}
