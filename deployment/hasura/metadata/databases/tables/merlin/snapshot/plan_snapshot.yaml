table:
  name: plan_snapshot
  schema: merlin
configuration:
  custom_name: "plan_snapshot"
object_relationships:
- name: plan
  using:
    foreign_key_constraint_on: plan_id
array_relationships:
  - name: activities
    using:
      foreign_key_constraint_on:
        column: snapshot_id
        table:
          name: plan_snapshot_activities
          schema: merlin
  - name: tags
    using:
      foreign_key_constraint_on:
        column: snapshot_id
        table:
          name: plan_snapshot_tags
          schema: tags
select_permissions:
  - role: 1-aerie_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 2-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: 3-user
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: 1-aerie_admin
    permission:
      columns: [description, taken_by]
      filter: {}
  - role: 2-user
    permission:
      columns: [description]
      filter: {"plan":{"_or":[
        {"owner":{"_eq":"X-Hasura-User-Id"}},
        {"collaborators":{"collaborator":{"_eq":"X-Hasura-User-Id"}}}]}}
delete_permissions:
  - role: 1-aerie_admin
    permission:
      filter: {}
