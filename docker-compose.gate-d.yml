# docker-compose.gate-d.yml
#
# Runs the Gate D spike (roadmap.md §3). Same layout convention as the
# other gate-*-spike overrides:
#
#   workspace/
#     plandev/            <- this repo (docker-compose.yml lives here)
#     pymerlin/
#     gate-a-spike/  gate-b-spike/  gate-c-spike/
#     gate-d-spike/         <- NEW sibling, bind-mounted below
#
# IMPORTANT: unlike gates A-C, Gate D-1 runs during `docker build`, not
# `docker compose run` -- if numpy/spiceypy/furnsh() fail, you'll see it
# fail during the `build` step below with a Python traceback, before the
# JUnit-based Gate D-2 ever runs.
#
# gate-d-spike/gradle-wrapper.properties points at a LOCAL file
# (file:/gate-d-spike/gradle-8.6-bin.zip) rather than downloading from
# services.gradle.org -- copy the gradle-8.6-bin.zip you already have into
# gate-d-spike/ before running this.
#
# Usage (from inside plandev/):
#   docker compose -f docker-compose.yml -f docker-compose.gate-d.yml \
#       build gate_d_spike     # <- Gate D-1's result shows up here
#   docker compose -f docker-compose.yml -f docker-compose.gate-d.yml \
#       run --rm gate_d_spike  # <- Gate D-2's result shows up here
services:
  gate_d_spike:
    build:
      context: ../gate-d-spike
      dockerfile: Dockerfile
    container_name: gate_d_spike
    volumes:
      - ../gate-d-spike:/gate-d-spike
      - gate_d_gradle_cache:/root/.gradle

volumes:
  gate_d_gradle_cache:
