# Permanent CI regression for the GraalPy embedding preconditions: that a Truffle Context
# can be created inside the built worker image, on the optimizing runtime, from a child
# classloader, against a venv that actually imports.
#
# WHY THIS IS NOT A JOB IN test.yml's `unit-test`:
#
# test.yml sets up `distribution: "temurin"` -- stock OpenJDK, which has no JVMCI enabled.
# A Context created under `./gradlew test` on a temurin runner falls back to Truffle's
# interpreter-only runtime, so it would pass while asserting the opposite of what this
# workflow exists to prove (it is why both images were rebased onto
# ghcr.io/graalvm/jdk-community:21 in the first place). The property under test belongs to
# the built IMAGE -- its JDK, its classpath, its venv -- so the check has to run inside the
# image.
#
# This lives in its own file rather than in test.yml because this fork tracks
# NASA-AMMOS:develop and merges from it regularly; keeping GraalPy changes out of shared
# files keeps those merges cheap.
name: GraalPy Preflight

on:
  pull_request:
    branches:
      # pymerlin/develop is where the GraalPy work integrates. `develop` is listed too so
      # the eventual pymerlin/develop -> develop PR runs this gate rather than skipping it
      # at exactly the merge that matters most.
      - pymerlin/develop
      - develop
  push:
    branches:
      - pymerlin/develop
  workflow_dispatch:
    inputs:
      pymerlin_ref:
        description: "pymerlin branch/ref to check out and build the venv from"
        required: false
        default: develop

permissions:
  contents: read

env:
  # Must match `graalPyVersion` in gradle.properties and ext.graalPyVersion in
  # pymerlin's java/pymerlin-shim/build.gradle. The "versions agree" step below
  # asserts both of those rather than trusting them.
  GRAALPY_VERSION: "25.0.2"
  PYMERLIN_REPO: "remy-rabideau/pymerlin"
  # Resolved once here so the checkout that gets version-checked and the venv that gets
  # built are guaranteed to be the same ref -- see the docker build step.
  PYMERLIN_REF: ${{ github.event.inputs.pymerlin_ref || 'develop' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    # The image build compiles CSPICE from source (~340s) on top of a full C toolchain
    # install, so this is minutes, not seconds. Fail loudly rather than hanging for the
    # default 6h if something regresses into the unpinned-numpy from-source path, which
    # looks like a hang rather than an error.
    timeout-minutes: 45

    steps:
      # merlin-worker/Dockerfile does not need a sibling pymerlin checkout to build --
      # install.sh pip-installs pymerlin from a git ref over the network instead of
      # `COPY`ing in a local checkout (the point of decoupling the image build from
      # requiring the pymerlin repo alongside plandev's). The build context is just
      # `plandev/`.
      #
      # The pymerlin checkout below is therefore only read by the version-agreement step:
      # it validates PYMERLIN_REF's pymerlin-shim/build.gradle against GRAALPY_VERSION.
      # The same PYMERLIN_REF is passed to `docker build` as a build arg, so the ref whose
      # Java shim gets version-checked here is the ref whose Python package ends up in the
      # venv -- without that build arg, install.sh would quietly use its own pinned release
      # tag and this job would check one ref while testing another.
      - name: Checkout plandev
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: plandev

      - name: Checkout pymerlin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.PYMERLIN_REPO }}
          ref: ${{ env.PYMERLIN_REF }}
          path: pymerlin

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/pymerlin/develop' }}

      # Cheap guard against the failure mode the version pins exist to prevent: the venv
      # built from one GraalPy release, the language jars on the classpath from another.
      # That mismatch does not fail the build -- it fails a simulation, later, elsewhere.
      - name: Check GraalPy versions agree
        working-directory: plandev
        run: |
          set -euo pipefail
          gradle_version="$(grep -E '^graalPyVersion=' gradle.properties | cut -d= -f2)"
          echo "gradle.properties : ${gradle_version}"
          echo "workflow env      : ${GRAALPY_VERSION}"
          if [ "${gradle_version}" != "${GRAALPY_VERSION}" ]; then
            echo "::error::graalPyVersion=${gradle_version} in gradle.properties does not match GRAALPY_VERSION=${GRAALPY_VERSION} in this workflow"
            exit 1
          fi
          shim_version="$(grep -E "^ext.graalPyVersion" ../pymerlin/java/pymerlin-shim/build.gradle | sed "s/.*'\(.*\)'.*/\1/")"
          echo "pymerlin-shim     : ${shim_version} (from ${PYMERLIN_REPO}@${PYMERLIN_REF})"
          if [ "${shim_version}" != "${GRAALPY_VERSION}" ]; then
            echo "::error::ext.graalPyVersion=${shim_version} in pymerlin-shim/build.gradle does not match ${GRAALPY_VERSION}. The shim would compile against an API the worker does not provide."
            exit 1
          fi

      # The Dockerfile's extractor stage consumes merlin-worker/build/distributions/*.tar,
      # so the distribution must exist before `docker build`.
      - name: Build merlin-worker distribution
        working-directory: plandev
        run: ./gradlew merlin-worker:distTar -x javadoc -x javadocJar --parallel

      # PYMERLIN_REF overrides install.sh's default (a pinned release tag) so this job
      # tests the branch under development rather than the last release. Changing it
      # invalidates the venv layer, which is why this job is minutes rather than seconds.
      #
      # NOTE: ubuntu-latest is amd64, so this exercises only the amd64 leg of install.sh's
      # arch mapping. The arm64 leg (Apple Silicon dev machines, Graviton) is implemented
      # in docker/graalpy/install.sh but is NOT covered here. If arm64 builds ever become
      # load-bearing, this is the job to add a matrix to.
      - name: Build merlin-worker image
        working-directory: plandev
        run: |
          set -euo pipefail
          docker build \
            --file merlin-worker/Dockerfile \
            --build-arg GRAALPY_VERSION="${GRAALPY_VERSION}" \
            --build-arg PYMERLIN_REF="${PYMERLIN_REF}" \
            --tag aerie_merlin_worker:preflight \
            .

      # The actual gate. Creates a Context and evaluates 1+1 *in the worker*, asserts the
      # engine is not on the interpreter-only fallback runtime, asserts a Context can be
      # created from a child classloader (how the worker loads mission-model JARs), and
      # asserts the venv imports. Non-zero exit fails the job.
      - name: Run GraalPy preflight in the worker image
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint java \
            aerie_merlin_worker:preflight \
            -cp '/usr/src/app/lib/*' \
            gov.nasa.jpl.aerie.merlin.worker.GraalPyPreflight
